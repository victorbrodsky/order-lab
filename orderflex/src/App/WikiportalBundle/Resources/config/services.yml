parameters:
  wikiportal.sitename: wikiportal


twig:
    globals:
        wikiportal_sitename: '%wikiportal.sitename%'

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        public: true       # Allows optimizing the container by removing unused services; this also means
                                    # fetching services directly from the container via $container->get() won't work.
                                    # The best practice is to be explicit about your dependencies anyway.

    wikiportal_authentication_handler:
        class: App\WikiportalBundle\Security\Authentication\PortalLoginSuccessHandler

    wikiportal_role_voter:
        class: App\WikiportalBundle\Security\Voter\PortalRoleVoter
        public: false
        tags:
            - { name: security.voter }

    wikiportal_permission_voter:
        class: App\WikiportalBundle\Security\Voter\PortalPermissionVoter
        public: false
        tags:
            - { name: security.voter }
